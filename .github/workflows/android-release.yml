name: Eta Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 与打包并行且不接触签名 Secrets；失败不影响 APK 上传，但会阻止发版草稿
  verify:
    name: Lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: Lint 与单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$ETA_RELEASE_KEYSTORE_BASE64" &&
                -n "$ETA_RELEASE_STORE_PASSWORD" &&
                -n "$ETA_RELEASE_KEY_ALIAS" &&
                -n "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$RUNNER_TEMP/eta-release.jks"
            store_password="$ETA_RELEASE_STORE_PASSWORD"
            key_alias="$ETA_RELEASE_KEY_ALIAS"
            key_password="$ETA_RELEASE_KEY_PASSWORD"
          else
            # 未配置发版 Secrets（例如个人复刻仓库）时不再中断构建：
            # 生成一次性签名证书，保证产出的 Release APK 可以直接安装。
            echo "::warning::未配置 Release 签名 Secrets，本次使用一次性生成的签名证书。"
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/eta-release.jks" \
              -storetype PKCS12 \
              -storepass eta-fork-build \
              -keypass eta-fork-build \
              -alias eta-fork \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Eta Fork, OU=Build, O=Eta, C=CN"
            store_password="eta-fork-build"
            key_alias="eta-fork"
            key_password="eta-fork-build"
          fi
          {
            echo "ETA_RELEASE_STORE_FILE=$RUNNER_TEMP/eta-release.jks"
            echo "ETA_RELEASE_STORE_PASSWORD=$store_password"
            echo "ETA_RELEASE_KEY_ALIAS=$key_alias"
            echo "ETA_RELEASE_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: 构建 Debug 与 Release APK
        # 签名参数由上一步写入 GITHUB_ENV；这里不再用 Secrets 覆盖，否则空值会禁用签名配置。
        # 发版标签保持纯净版本名；其余构建追加 +<短提交号>，与已发布版本区分
        run: |
          metadata_arg=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            metadata_arg=("-Peta.buildMetadata=${GITHUB_SHA::7}")
          fi
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" \
            :app:assembleDebug :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        run: |
          # 文件名由 Gradle 按 versionName 生成，例如 Eta-vX.Y.Z.apk、Eta-vX.Y.Z-debug+<sha>.apk
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          release_apks=(app/build/outputs/apk/release/Eta-v*.apk)
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ${#debug_apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#debug_apks[@]}）。"
            exit 1
          fi
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#release_apks[@]}）。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify "${release_apks[0]}"

          # 发版标签必须与 versionName 一致，避免标签与安装包版本错位
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="$(jq -r '.elements[0].versionName' \
              app/build/outputs/apk/release/output-metadata.json)"
            if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
              echo "::error::标签 $GITHUB_REF_NAME 与 versionName $version_name 不一致。"
              exit 1
            fi
          fi
          echo "debug_path=${debug_apks[0]}" >> "$GITHUB_OUTPUT"
          echo "release_path=${release_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  # 构建 job 持有签名 Secrets，写 Release 的权限单独放在这里，且只在发版标签上运行
  publish-release:
    name: 发布 Release APK
    # 个人复刻仓库里 lint/单测不是发版门槛；只依赖实际构建结果
    needs: [build-apks]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # 未压缩上传的 Artifact 以文件名命名。文件名不经 job outputs 传递：
      # 输出值只要包含任一 Secret 的子串就会被 Actions 整体丢弃，下载步骤随之退化为下载全部产物。
      # 标签已在构建 job 中校验等于 v<versionName>，Gradle 产物名为 Eta-v<versionName>.apk，可直接由标签推导。
      - name: 下载 Release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Eta-${{ github.ref_name }}.apk
          path: ${{ runner.temp }}/release

      # 个人复刻仓库直接发布正式 Release，产物无需登录即可下载
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ runner.temp }}/release/Eta-${{ github.ref_name }}.apk
        run: >-
          gh release create "$GITHUB_REF_NAME" "$APK_PATH"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Eta Fork $GITHUB_REF_NAME"
          --notes "个人复刻构建：保留 MCP 工具参数与结果到持久会话，修复跨轮断链。包名 io.github.mangi.eta。"
